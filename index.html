<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI 결과물 갤러리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#14181f; --muted:#5d6675; --line:#e3e6eb;
  --accent:#1a4fd6; --accent-soft:#e8eefc; --chip:#eef0f3; --shadow:0 1px 2px rgba(20,24,31,.06),0 8px 24px rgba(20,24,31,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c24; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a303b;
  --accent:#7aa2ff; --accent-soft:#1d2a4a; --chip:#232833; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
h1{font-size:clamp(28px,4vw,40px);line-height:1.2;margin:8px 0 10px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0;font-size:16px}
.sections{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.section{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:15px;font-weight:700;padding:8px 18px;border-radius:999px;cursor:pointer}
.section[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks{display:inline-flex;gap:4px;margin-top:14px;padding:4px;background:var(--chip);border-radius:12px;max-width:100%;overflow-x:auto}
.week{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:9px;cursor:pointer;white-space:nowrap}
.week span{display:block;font-size:12px;font-weight:500;margin-top:1px}
.week[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:flex;gap:20px;margin-top:20px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:18px;margin-right:4px}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.toolbar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);outline:none}
.thumb{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-weight:600}
.tag.dept{background:var(--chip);color:var(--muted);font-weight:500}
.card h2{font-size:17px;margin:0;line-height:1.35;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.who{margin-top:auto;padding-top:6px;font-size:14px;font-weight:600}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}
dialog{border:0;padding:0;width:min(1100px,100vw);max-width:100vw;height:min(92vh,900px);max-height:100vh;border-radius:16px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.6)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-head{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
.dlg-head h3{margin:0;font-size:20px;line-height:1.3}
.dlg-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.close{margin-left:auto;border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;gap:4px;padding:14px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tab-spacer{flex:1}
.open-link{align-self:center;font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap;padding:0 4px}
.frame{flex:1;background:var(--bg)}
.frame iframe{width:100%;height:100%;border:0;display:block}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
@media (max-width:640px){
  header{padding:36px 0 20px}
  .wrap{padding:0 16px}
  dialog{height:100vh;border-radius:0}
}
</style>
</head>
<body>
<header class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1>AI Agent 결과물 갤러리</h1>
  <p class="lead" id="lead"></p>
  <div class="sections" id="sections" role="tablist" aria-label="과정 선택"></div>
  <div class="weeks" id="weeks" role="tablist" aria-label="주차 선택"></div>
  <div class="stats" id="stats"><span><b id="cnt"></b>개 결과물</span><span><b id="ppl"></b>명 참여</span><span><b id="date"></b>제출</span></div>
</header>

<div class="toolbar" id="toolbar"><div class="wrap">
  <input class="search" id="q" type="search" placeholder="이름, 부서, 프로젝트명으로 검색" aria-label="검색">
  <div class="chips" id="chips" role="group" aria-label="조 필터"></div>
</div></div>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer class="wrap">교육용 가상 데이터로 만든 PoC 결과물입니다. 자료는 Google Drive에서 제공됩니다.</footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg">
    <div class="dlg-head">
      <div><h3 id="dlgTitle"></h3><div class="sub" id="dlgSub"></div></div>
      <button class="close" id="close" aria-label="닫기">×</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="frame" id="frame"></div>
  </div>
</dialog>

const SECTIONS = {
  aiexpert: {label:"AI Expert", weeks:{
  week1: {label:"1주차", sub:"Claude Code", data:W1, thumbs:"thumbs/", date:"2026.10.16",
    eyebrow:"삼성생명 AI Expert 과정 · 1주차 개인 과제",
    lead:"수강생들이 직접 기획하고 만든 업무 AI 에이전트를 모았습니다. 카드를 누르면 팜플렛, 발표자료, 시연영상을 바로 볼 수 있어요.",
    kinds:[["pamphlet","팜플렛"],["slides","발표자료"],["video","시연영상"]]},
  week2: {label:"2주차", sub:"Copilot Studio", data:W2, thumbs:"thumbs/w2/", date:"2026.10.23",
    eyebrow:"삼성생명 AI Expert 과정 · 2주차 개인 과제",
    lead:"1주차에 만든 에이전트를 사내 환경(M365 Copilot · Copilot Studio)으로 옮긴 결과물입니다. 카드를 누르면 팜플렛, 발표자료, 시연영상, 에이전트 솔루션 파일을 볼 수 있어요.",
    kinds:[["pamphlet","팜플렛"],["slides","발표자료"],["video","시연영상"],["solution","에이전트 솔루션"]]},
}},
  aiadvanced: {label:"AI Advanced", weeks:{
  final: {label:"최종 과제", sub:"AI Advanced", data:W3, thumbs:"thumbs/adv/", date:"2026.08.21",
    eyebrow:"삼성생명 AI Advanced 과정 · 최종 과제",
    lead:"AI Advanced 과정에서 수강생들이 만든 업무 AI 에이전트를 모았습니다. 카드를 누르면 팜플렛과 발표자료를 바로 볼 수 있어요.",
    kinds:[["pamphlet","팜플렛"],["slides","발표자료"]]},
  }},
};
const $ = s => document.querySelector(s);
const grid = $("#grid"), chips = $("#chips"), q = $("#q"), dlg = $("#dlg"), weeks = $("#weeks"), sections = $("#sections");
let section, week, CUR, team = "전체";
let DATA = [], KINDS = [];

// #aiexpert/week2 형식. 예전 링크(#week1, #week2)는 AI Expert로 연결
function parseHash(){
  let [s, w] = location.hash.slice(1).split("/");
  if(!SECTIONS[s]){ w = SECTIONS.aiexpert.weeks[s] ? s : undefined; s = "aiexpert"; }
  const ws = Object.keys(SECTIONS[s].weeks);
  if(!ws.includes(w)) w = ws[0];
  return [s, w];
}
function go(s, w){
  history.replaceState(null, "", "#" + s + (w ? "/" + w : ""));
  setView(s, w);
}

Object.entries(SECTIONS).forEach(([k,sec])=>{
  const b = document.createElement("button");
  b.className="section"; b.role="tab"; b.dataset.section=k; b.textContent=sec.label;
  b.onclick=()=>go(k, Object.keys(sec.weeks)[0]);
  sections.appendChild(b);
});

function setView(s, w){
  section = s; week = w; const sec = SECTIONS[s];
  sections.querySelectorAll(".section").forEach(b=>b.setAttribute("aria-selected", b.dataset.section===s));
  weeks.innerHTML = "";
  Object.entries(sec.weeks).forEach(([k,wk])=>{
    const b = document.createElement("button");
    b.className="week"; b.role="tab"; b.setAttribute("aria-selected", k===w);
    b.innerHTML = `${wk.label}<span>${wk.sub}</span>`;
    b.onclick=()=>go(s, k);
    weeks.appendChild(b);
  });
  const has = !!w;
  weeks.hidden = Object.keys(sec.weeks).length < 2; $("#stats").hidden = !has; $("#toolbar").hidden = !has;
  chips.innerHTML = ""; team = "전체"; q.value = "";
  if(!has){
    CUR = null; DATA = []; KINDS = [];
    $("#eyebrow").textContent = sec.eyebrow; $("#lead").textContent = sec.lead;
    grid.innerHTML = `<div class="empty">아직 등록된 결과물이 없어요.</div>`;
    return;
  }
  CUR = sec.weeks[w]; DATA = CUR.data; KINDS = CUR.kinds;
  $("#eyebrow").textContent = CUR.eyebrow; $("#lead").textContent = CUR.lead; $("#date").textContent = CUR.date;
  $("#cnt").textContent = DATA.length;
  $("#ppl").textContent = new Set(DATA.flatMap(d=>d.name.split(",").map(x=>x.trim()))).size;
  const teams = ["전체", ...[...new Set(DATA.map(d=>d.team).filter(Boolean))].sort()];
  teams.forEach(t=>{
    const b = document.createElement("button");
    b.className="chip"; b.textContent=t; b.setAttribute("aria-pressed", t===team);
    b.onclick=()=>{team=t; chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render();};
    chips.appendChild(b);
  });
  render();
}

const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const term = q.value.trim().toLowerCase();
  const list = DATA.filter(d =>
    (team==="전체" || d.team===team) &&
    (!term || [d.name,d.dept,d.title,d.summary].join(" ").toLowerCase().includes(term)));
  grid.innerHTML = list.length ? list.map(d=>`
    <button class="card" data-n="${d.n}">
      <div class="thumb"><img src="${CUR.thumbs}${d.thumb || d.n}.jpg" alt="${esc(d.title)} 팜플렛 첫 페이지" loading="lazy"></div>
      <div class="body">
        <div class="meta">${d.team?`<span class="tag">${d.team}</span>`:""}<span class="tag dept">${esc(d.dept)}</span></div>
        <h2>${esc(d.title)}</h2>
        ${d.summary?`<p>${esc(d.summary)}</p>`:""}
        <div class="who">${esc(d.name)}</div>
      </div>
    </button>`).join("") : `<div class="empty">조건에 맞는 결과물이 없어요.</div>`;
}
grid.addEventListener("click", e=>{
  const c = e.target.closest(".card"); if(c) open(DATA.find(d=>d.n==c.dataset.n));
});
q.addEventListener("input", render);

function open(d){
  $("#dlgTitle").textContent = d.title;
  $("#dlgSub").textContent = `${d.name} · ${d.dept}${d.team?" · "+d.team:""}`;
  const tabs = $("#tabs"); tabs.innerHTML="";
  const link = document.createElement("a");
  link.className="open-link"; link.target="_blank"; link.rel="noopener"; link.textContent="새 창에서 열기 ↗";
  // 한 종류에 파일이 여러 개면 "발표자료 1", "발표자료 2"로 탭을 나눔
  const items = KINDS.flatMap(([k,label])=>{
    const v = [].concat(d.ids[k] || []).filter(Boolean);
    return v.map((id,j)=>[id, v.length>1 ? `${label} ${j+1}` : label]);
  });
  items.forEach(([id,label],i)=>{
    const t = document.createElement("button");
    t.className="tab"; t.role="tab"; t.textContent=label;
    t.onclick=()=>{
      tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
      $("#frame").innerHTML = `<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen title="${label}"></iframe>`;
      link.href = `https://drive.google.com/file/d/${id}/view`;
    };
    tabs.appendChild(t);
    if(i===0) queueMicrotask(()=>t.click());
  });
  const sp = document.createElement("span"); sp.className="tab-spacer"; tabs.append(sp, link);
  dlg.showModal();
}
$("#close").onclick = ()=>dlg.close();
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener("close", ()=>{ $("#frame").innerHTML=""; });
window.addEventListener("hashchange", ()=>{ const [s,w] = parseHash(); if(s!==section || w!==week) setView(s,w); });
setView(...parseHash());
</script>
</body>
</html>
